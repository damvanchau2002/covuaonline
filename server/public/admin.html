<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Server Admin - Cờ Vua</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body class="bg-[#0f1320] text-[#d7e1ff]">
  <header class="bg-[#151a28] border-b border-[#1f2636] px-4 py-3 flex items-center justify-between">
    <h1 class="text-lg font-semibold">Server Admin</h1>
    <div class="flex items-center gap-3 text-[#98a3c7]">
      <span id="srv">Backend: http://localhost:4000</span>
      <button id="refresh" class="px-3 py-1 rounded border border-[#1f2636] hover:text-[#31f39d] hover:border-[#31f39d]">Làm mới</button>
      <span id="updated"></span>
    </div>
  </header>

  <main>
    <section>
      <h2 class="text-base my-3">Danh sách phòng</h2>
      <div id="rooms" class="grid gap-3 grid-cols-[repeat(auto-fill,minmax(360px,1fr))]"></div>
    </section>
    <!-- Viewer Modal -->
    <div id="viewerModal" class="modal hidden" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-header">
          <strong>Xem ván cờ</strong>
          <button id="viewerClose" class="icon-btn" title="Đóng">✕</button>
        </div>
        <div class="modal-body">
          <div class="viewer-meta">
            <span id="viewerRoom"></span>
            <span id="viewerTurn"></span>
          </div>
          <div class="board-area">
            <div id="board" class="board" aria-label="Bàn cờ"></div>
            <div id="coordsX" class="coords-x" aria-hidden="true"></div>
          </div>
          <div class="viewer-moves">
            <div class="meta">Lịch sử nước đi:</div>
            <ul id="viewerMoves" class="moves"></ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <small>© Phòng Online Cờ Vua</small>
  </footer>

  <script src="/static/admin.js"></script>
</body>
</html>
